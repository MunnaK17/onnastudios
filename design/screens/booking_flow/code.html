<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mood Studios - Booking Flow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500&amp;family=Manrope:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined', sans-serif;
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#f0eee9",
                        "inverse-primary": "#cdc5c0",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#30312e",
                        "secondary-container": "#fddab2",
                        "primary-container": "#2d2926",
                        "on-secondary-fixed-variant": "#594325",
                        "on-primary-fixed-variant": "#4b4642",
                        "error": "#ba1a1a",
                        "outline": "#7e756f",
                        "tertiary-fixed": "#ffdad3",
                        "primary": "#181512",
                        "surface-container-high": "#eae8e3",
                        "surface-variant": "#e4e2dd",
                        "on-primary-container": "#96908b",
                        "surface-bright": "#fbf9f4",
                        "on-secondary-container": "#785e3e",
                        "on-tertiary-container": "#d17a66",
                        "tertiary": "#320400",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f5f3ee",
                        "on-primary-fixed": "#1e1b18",
                        "secondary-fixed": "#ffddb6",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dbdad5",
                        "tertiary-fixed-dim": "#ffb4a4",
                        "surface-container-highest": "#e4e2dd",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#4d4540",
                        "secondary-fixed-dim": "#e2c19b",
                        "tertiary-container": "#501609",
                        "on-tertiary": "#ffffff",
                        "background": "#fbf9f4",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#cdc5c0",
                        "secondary": "#735a3a",
                        "surface-tint": "#635d5a",
                        "on-tertiary-fixed-variant": "#763223",
                        "primary-fixed": "#e9e1dc",
                        "on-secondary-fixed": "#291801",
                        "on-background": "#1b1c19",
                        "inverse-on-surface": "#f2f1ec",
                        "outline-variant": "#cfc4bd",
                        "surface": "#fbf9f4",
                        "on-tertiary-fixed": "#3c0701",
                        "on-surface": "#1b1c19",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "card-gap": "32px",
                        "gutter": "24px",
                        "margin-desktop": "64px",
                        "unit": "8px",
                        "section-padding": "120px"
                    },
                    "fontFamily": {
                        "h2": ["Epilogue"],
                        "body-md": ["Manrope"],
                        "h3": ["Epilogue"],
                        "label-caps": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "h1": ["Epilogue"]
                    },
                    "fontSize": {
                        "h2": ["36px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "h3": ["24px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "h1": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-32">
<!-- TopAppBar Shared Component -->
<header class="bg-background dark:bg-inverse-surface docked full-width top-0 flat no shadows z-50">
<div class="flex justify-between items-center w-full px-margin-mobile py-4 max-w-7xl mx-auto text-primary dark:text-primary-fixed">
<div class="flex items-center gap-4 cursor-pointer hover:opacity-80 transition-opacity">
<!-- Replaced avatar with a back button contextually for a booking flow, as per linear/transactional logic -->
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</div>
<h1 class="font-h3 text-h3 font-medium text-primary dark:text-primary-fixed text-center absolute left-1/2 -translate-x-1/2">
                Mood Studios
            </h1>
<div class="flex items-center cursor-pointer hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</div>
</div>
</header>
<main class="max-w-3xl mx-auto px-margin-mobile pt-8 pb-section-padding">
<!-- Class Context Header -->
<section class="mb-12 text-center flex flex-col items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider mb-2">Booking Confirmation</span>
<h2 class="font-h2 text-h2 text-primary mb-2">Vinyasa Flow</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="calendar_today">calendar_today</span>
                Tomorrow, 9:00 AM • 60 min
            </p>
</section>
<!-- Step 1: Mat Layout -->
<section class="mb-8">
<div class="flex items-center justify-between mb-4 px-2">
<h3 class="font-h3 text-h3 text-primary">1. Select Spot</h3>
<span class="font-label-caps text-label-caps text-on-surface-variant px-3 py-1 bg-surface-container rounded-full">Front of Room</span>
</div>
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_4px_40px_0px_rgba(45,41,38,0.04)] border border-surface-variant">
<!-- Teacher Desk Indicator -->
<div class="w-24 h-4 bg-outline-variant rounded-full mx-auto mb-10 opacity-50"></div>
<!-- Mat Grid Layout -->
<div class="grid grid-cols-4 gap-x-6 gap-y-8 max-w-md mx-auto">
<!-- Row 1 -->
<button class="w-12 h-24 rounded-md border-2 border-surface-variant bg-surface-variant text-on-surface-variant opacity-40 cursor-not-allowed flex items-center justify-center transition-all">
<span class="font-label-caps text-label-caps">1</span>
</button>
<button class="w-12 h-24 rounded-md border border-outline-variant bg-background text-on-surface hover:border-primary hover:shadow-sm flex items-center justify-center transition-all">
<span class="font-label-caps text-label-caps">2</span>
</button>
<button class="w-12 h-24 rounded-md border-2 border-surface-variant bg-surface-variant text-on-surface-variant opacity-40 cursor-not-allowed flex items-center justify-center transition-all">
<span class="font-label-caps text-label-caps">3</span>
</button>
<button class="w-12 h-24 rounded-md border border-outline-variant bg-background text-on-surface hover:border-primary hover:shadow-sm flex items-center justify-center transition-all">
<span class="font-label-caps text-label-caps">4</span>
</button>
<!-- Row 2 -->
<button class="w-12 h-24 rounded-md border border-outline-variant bg-background text-on-surface hover:border-primary hover:shadow-sm flex items-center justify-center transition-all">
<span class="font-label-caps text-label-caps">5</span>
</button>
<!-- Selected Mat -->
<button class="w-12 h-24 rounded-md border-2 border-secondary bg-secondary-fixed text-on-secondary-fixed shadow-md flex items-center justify-center transition-all scale-105">
<span class="font-label-caps text-label-caps">6</span>
</button>
<button class="w-12 h-24 rounded-md border border-outline-variant bg-background text-on-surface hover:border-primary hover:shadow-sm flex items-center justify-center transition-all">
<span class="font-label-caps text-label-caps">7</span>
</button>
<button class="w-12 h-24 rounded-md border-2 border-surface-variant bg-surface-variant text-on-surface-variant opacity-40 cursor-not-allowed flex items-center justify-center transition-all">
<span class="font-label-caps text-label-caps">8</span>
</button>
<!-- Row 3 -->
<button class="w-12 h-24 rounded-md border border-outline-variant bg-background text-on-surface hover:border-primary hover:shadow-sm flex items-center justify-center transition-all">
<span class="font-label-caps text-label-caps">9</span>
</button>
<button class="w-12 h-24 rounded-md border-2 border-surface-variant bg-surface-variant text-on-surface-variant opacity-40 cursor-not-allowed flex items-center justify-center transition-all">
<span class="font-label-caps text-label-caps">10</span>
</button>
<button class="w-12 h-24 rounded-md border border-outline-variant bg-background text-on-surface hover:border-primary hover:shadow-sm flex items-center justify-center transition-all">
<span class="font-label-caps text-label-caps">11</span>
</button>
<button class="w-12 h-24 rounded-md border border-outline-variant bg-background text-on-surface hover:border-primary hover:shadow-sm flex items-center justify-center transition-all">
<span class="font-label-caps text-label-caps">12</span>
</button>
</div>
<!-- Legend -->
<div class="flex justify-center gap-6 mt-10 pt-6 border-t border-surface-container">
<div class="flex items-center gap-2">
<div class="w-4 h-4 rounded-sm border border-outline-variant bg-background"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">Available</span>
</div>
<div class="flex items-center gap-2">
<div class="w-4 h-4 rounded-sm border-2 border-secondary bg-secondary-fixed"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">Selected</span>
</div>
<div class="flex items-center gap-2">
<div class="w-4 h-4 rounded-sm bg-surface-variant opacity-50"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">Booked</span>
</div>
</div>
</div>
</section>
<!-- Step 2: Payment Summary -->
<section>
<h3 class="font-h3 text-h3 text-primary mb-4 px-2 mt-12">2. Summary</h3>
<div class="bg-surface-container-lowest rounded-xl p-6 md:p-8 shadow-[0_4px_40px_0px_rgba(45,41,38,0.04)] border border-surface-variant">
<div class="flex justify-between items-center mb-6 pb-6 border-b border-surface-container">
<span class="font-body-lg text-body-lg text-on-surface-variant">Current Balance</span>
<span class="font-h3 text-h3 text-primary">12 Credits</span>
</div>
<div class="flex justify-between items-center mb-6 text-tertiary-container">
<span class="font-body-lg text-body-lg flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="remove">remove</span>
                        Class Cost
                    </span>
<span class="font-h3 text-h3 font-semibold">- 1 Credit</span>
</div>
<div class="flex justify-between items-center pt-6 border-t border-surface-container bg-surface-bright -mx-6 md:-mx-8 px-6 md:px-8 pb-2 mt-4 rounded-b-xl">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Remaining Balance</span>
<span class="font-h2 text-h2 text-secondary">11</span>
</div>
</div>
</section>
</main>
<!-- Fixed Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-md px-margin-mobile py-6 border-t border-surface-container shadow-[0_-10px_40px_0px_rgba(45,41,38,0.05)] z-50">
<div class="max-w-3xl mx-auto flex gap-4">
<button class="w-full bg-tertiary text-on-tertiary font-label-caps text-label-caps uppercase tracking-widest py-5 rounded-full hover:bg-on-tertiary-fixed-variant transition-colors shadow-sm">
                Confirm Booking
            </button>
</div>
</div>
</body></html>
