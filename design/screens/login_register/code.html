<body class="bg-background text-on-background min-h-screen flex font-body-md antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Left Image Canvas (Desktop) -->
<div class="hidden lg:block lg:w-5/12 xl:w-1/2 relative overflow-hidden bg-surface-container">
<img alt="Studio interior" class="absolute inset-0 w-full h-full object-cover opacity-90" data-alt="A serene, sunlit yoga studio featuring minimalist aesthetics and natural textures. Soft morning light streams through sheer white curtains, casting long, elegant shadows across warm hardwood flooring. A single, perfectly placed terracotta yoga mat rests in the center of the expansive, un-cluttered space. The mood is tranquil, grounding, and high-end, perfectly embodying a breathable luxury atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCh3qZsGZaISCadS6-sgD_ZREmb82y5cXZmXKgWd1kEveDP9TCFmLO1nRxoz54h_dSAh3pDwP08DjGVyByNfhdn6iGvsIMzptasclGrnw0xEhC8ofloLnyQWpyROwbeB7GzOoj2sEgMQiQ6bxtK9OkFHBwPybDDfX4PJ87YEvSUsDDXSQFR3LKgvB7uXxUB2iI17OjECJ6Ckg1TxWb3rZCAkCty4NpuysYgrzg9uQ167NEqzolu0auwz0r7JftJjR14P0mvopP0nvfV"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/30 to-transparent"></div>
<div class="absolute bottom-margin-desktop left-margin-desktop pr-margin-desktop text-surface-container-lowest">
<h2 class="font-h2 text-h2 mb-4">Find your center.</h2>
<p class="font-body-lg text-body-lg opacity-90 max-w-md">Step into a space designed for clarity, movement, and intentional rest.</p>
</div>
</div>
<!-- Right Form Canvas -->
<div class="w-full lg:w-7/12 xl:w-1/2 flex items-center justify-center p-margin-mobile py-section-padding md:p-margin-desktop bg-background relative z-10">
<div class="w-full max-w-md flex flex-col gap-10">
<!-- Minimal Logo/Brand -->
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">spa</span>
<span class="font-h3 text-h3 text-primary tracking-tight">Mood Studios</span>
</div>
<!-- Header Text -->
<div class="flex flex-col gap-2">
<h1 class="font-h2 text-h2 text-primary">Welcome back</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6">
<!-- Input Group: Email -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase" for="email">Email</label>
<input class="bg-surface-container border-transparent focus:border-outline focus:ring-0 rounded-xl px-4 py-4 font-body-md text-primary placeholder-outline-variant w-full transition-colors" id="email" placeholder="name@example.com" type="email"/>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase" for="password">Password</label>
<input class="bg-surface-container border-transparent focus:border-outline focus:ring-0 rounded-xl px-4 py-4 font-body-md text-primary placeholder-outline-variant w-full transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Form Options -->
<div class="flex justify-between items-center mt-[-8px]">
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-on-tertiary-container bg-surface-container focus:ring-on-tertiary-container focus:ring-offset-background transition-colors" type="checkbox"/>
<span class="font-body-md text-on-surface-variant group-hover:text-primary transition-colors">Remember me</span>
</label>
<a class="font-body-md text-primary hover:text-on-tertiary-container transition-colors underline-offset-4 hover:underline" href="#">Forgot password?</a>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 mt-6">
<button class="w-full bg-on-tertiary-container text-surface-container-lowest rounded-xl py-4 font-label-caps text-label-caps tracking-widest uppercase hover:opacity-90 transition-opacity flex justify-center items-center gap-2" type="submit">
                        Log In
                    </button>
<button class="w-full bg-transparent border border-outline text-primary rounded-xl py-4 font-label-caps text-label-caps tracking-widest uppercase hover:border-primary hover:bg-surface-container transition-colors" type="button">
                        Create Account
                    </button>
</div>
</form>
<!-- Social Divider -->
<div class="flex items-center gap-4 my-2">
<div class="h-[1px] bg-surface-variant flex-1"></div>
<span class="font-label-caps text-label-caps text-outline tracking-widest uppercase">Or continue with</span>
<div class="h-[1px] bg-surface-variant flex-1"></div>
</div>
<!-- Social Logins -->
<div class="flex gap-4">
<button class="flex-1 flex items-center justify-center gap-3 border border-surface-variant bg-surface-container-low rounded-xl py-3 hover:bg-surface-variant transition-colors group" type="button">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors text-xl">g_translate</span>
<span class="font-label-caps text-label-caps text-primary tracking-widest uppercase">Google</span>
</button>
<button class="flex-1 flex items-center justify-center gap-3 border border-surface-variant bg-surface-container-low rounded-xl py-3 hover:bg-surface-variant transition-colors group" type="button">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors text-xl">ios</span>
<span class="font-label-caps text-label-caps text-primary tracking-widest uppercase">Apple</span>
</button>
</div>
</div>
</div>
